server:
  port: 9999
spring:
  config:
    activate:
      on-profile: prod
  datasource:
#    #默认（本地数据库）
#    username: root
#    password: 123456
#    url: jdbc:mysql://localhost/xdb?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true
#    driver-class-name: com.mysql.cj.jdbc.Driver
    #云服务器MySQL
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # HikariCP 连接池配置
    hikari:
      # 连接池最大连接数（默认 10）
      maximum-pool-size: 5
      # 最小空闲连接数（默认与 maximum-pool-size 相同）
      minimum-idle: 2
      # 连接超时时间，毫秒（默认 30000 = 30秒）
      connection-timeout: 20000
      # 空闲连接超时时间，毫秒（默认 600000 = 10分钟）
      idle-timeout: 300000
      # 连接最大生命周期，毫秒（默认 1800000 = 30分钟）
      max-lifetime: 1200000

  data:
    redis:
      port: 6379
      host: redis # docker中的redis服务名称
      password: ${REDIS_PASSWORD}

# AI Configuration
ai:
  deepseek:
    api-key: ${AI_DEEPSEEK_API_KEY}
    url: ${AI_DEEPSEEK_URL:https://api.deepseek.com/chat/completions}
    model: ${AI_DEEPSEEK_MODEL:deepseek-chat}

jwt:
  secret: ${JWT_SECRET}

# Tianai-Captcha 验证码配置
captcha:
  # 初始化默认资源（必须设置为 true 以加载默认的滑块验证码模板）
  init-default-resource: true
  # 验证码数据缓存键前缀
  prefix: "captcha:slider"
  # 过期时间（毫秒）
  expire:
    default: 120000
    WORD_IMAGE_CLICK: 20000
  # 本地缓存配置
  local-cache-enabled: false
  # 二次验证配置
  secondary:
    enabled: false


logging:
  level:
    com.diy: info

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1
  type-aliases-package: com.diy.sys.entity

cloudflare:
  r2:
    access-key: ${CLOUDFLARE_R2_ACCESS_KEY}
    secret-key: ${CLOUDFLARE_R2_SECRET_KEY}
    endpoint: ${CLOUDFLARE_R2_ENDPOINT}
    bucket-name: ${CLOUDFLARE_R2_BUCKET_NAME}
    domain: ${CLOUDFLARE_R2_DOMAIN} # 你绑定的访问域名
