services:
    backend:
        build:
            context: ./backend-java
            args:
                BACKEND_BUILD_IMAGE: ${BACKEND_BUILD_IMAGE:-maven:3.9-eclipse-temurin-17}
                BACKEND_RUNTIME_IMAGE: ${BACKEND_RUNTIME_IMAGE:-maven:3.9-eclipse-temurin-17}
        container_name: x-admin
        expose:
            - "9999"
        volumes:
            - ./backend-java/logs:/app/logs
        environment:
            SERVER_PORT: ${SERVER_PORT:-9999}
            SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
            SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
            SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
            SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

            SPRING_DATA_REDIS_HOST: redis
            SPRING_DATA_REDIS_PORT: 6379
            SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
            REDIS_PASSWORD: ${REDIS_PASSWORD}
            AI_DEEPSEEK_API_KEY: ${AI_DEEPSEEK_API_KEY}
            AI_DEEPSEEK_URL: ${AI_DEEPSEEK_URL:-https://api.deepseek.com/chat/completions}
            AI_DEEPSEEK_MODEL: ${AI_DEEPSEEK_MODEL:-deepseek-chat}
            CLOUDFLARE_R2_ACCESS_KEY: ${CLOUDFLARE_R2_ACCESS_KEY}
            CLOUDFLARE_R2_SECRET_KEY: ${CLOUDFLARE_R2_SECRET_KEY}
            CLOUDFLARE_R2_ENDPOINT: ${CLOUDFLARE_R2_ENDPOINT}
            CLOUDFLARE_R2_BUCKET_NAME: ${CLOUDFLARE_R2_BUCKET_NAME}
            CLOUDFLARE_R2_DOMAIN: ${CLOUDFLARE_R2_DOMAIN}
            JWT_SECRET: ${JWT_SECRET}
            # JVM 堆内存限制（JVM 自动读取 JAVA_TOOL_OPTIONS，无需改 Dockerfile）
            # -Xms: 初始堆, -Xmx: 最大堆, XX:+ExitOnOutOfMemoryError: OOM 时主动退出让 Docker 重启
            JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m -XX:+ExitOnOutOfMemoryError"
        deploy:
            resources:
                limits:
                    memory: 896M  # 容器最大内存（超出会被 OOM kill）
        networks:
            - x_net
    frontend:
        build:
            context: ./frontend-web
            args:
                NODE_IMAGE: ${NODE_IMAGE:-docker.1ms.run/node:22-alpine}
                NGINX_IMAGE: ${NGINX_IMAGE:-docker.1ms.run/nginx:alpine}
        container_name: web-vue3
        ports:
            - "8888:80"
        volumes:
            - ./frontend-web/logs:/var/log/nginx
        deploy:
            resources:
                limits:
                    memory: 64M  # nginx 静态文件服务，64M 足够
        networks:
            - x_net
    redis:
        image: docker.1ms.run/redis:7.0
        container_name: x_redis
        ports:
            - "6379:6379" # 必须暴露，因为你的 IDE 在容器外面
        command: redis-server --requirepass ${REDIS_PASSWORD}
        volumes:
            - ./data/redis:/data
        deploy:
            resources:
                limits:
                    memory: 256M  # Redis 缓存上限，超出按 allkeys-lru 策略淘汰
        networks:
            - x_net # 确保和你的前后端在同一个网络

networks:
    x_net:
        driver: bridge


